<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta de CEP</title>

  <!-- Materialize CSS, ícones e fontes (via CDN) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">

  

  <style>
    :root {
      --tinta: #0f2447;
      --azul: #1f5fbf;
      --amarelo: #ffcb05;
      --vermelho: #d6342c;
      --fundo: #e9eef5;
      --papel: #ffffff;
      --texto: #27364f;
      --texto-suave: #5d6b82;
      --linha: #cfd8e6;
      --erro: #b3261e;
    }

    html, body {
      font-family: 'Figtree', system-ui, sans-serif;
      color: var(--texto);
    }

    body {
      background: var(--fundo);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    h1, h2, .titulo {
      font-family: 'Bricolage Grotesque', 'Figtree', sans-serif;
    }

    /* ---------- Navbar ---------- */
    nav {
      background: var(--tinta);
      box-shadow: none;
      border-bottom: 4px solid var(--amarelo);
      height: 64px;
      line-height: 64px;
    }

    nav .brand-logo {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-weight: 700;
      font-size: 1.4rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    nav .brand-logo .marca {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: var(--amarelo);
      color: var(--tinta);
    }

    nav .brand-logo .marca .material-icons {
      font-size: 22px;
      line-height: 1;
    }

    nav ul a {
      font-weight: 500;
      transition: background-color .2s;
    }

    nav ul li.active {
      background: transparent;
      box-shadow: inset 0 -3px 0 var(--amarelo);
    }

    nav ul a:hover {
      background: rgba(255, 255, 255, .08);
    }

    /* ---------- Conteúdo ---------- */
    main {
      flex: 1;
      padding: 48px 0 40px;
    }

    .intro {
      margin-bottom: 28px;
    }

    .intro h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 5vw, 2.8rem);
      line-height: 1.1;
      font-weight: 700;
      color: var(--tinta);
    }

    .intro p {
      margin: 0;
      font-size: 1.1rem;
      color: var(--texto-suave);
      max-width: 52ch;
    }

    /* Cartão com borda de correspondência aérea (único destaque da página) */
    .etiqueta {
      position: relative;
      background: var(--papel);
      border-radius: 14px;
      padding: 40px 36px 28px;
      box-shadow: 0 1px 2px rgba(15, 36, 71, .08), 0 12px 32px -12px rgba(15, 36, 71, .25);
      overflow: hidden;
    }

    .etiqueta::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 10px;
      background: repeating-linear-gradient(
        -45deg,
        var(--azul) 0 14px,
        var(--papel) 14px 24px,
        var(--vermelho) 24px 38px,
        var(--papel) 38px 48px
      );
    }

    .barra-carregando {
      position: absolute;
      inset: 10px 0 auto 0;
      margin: 0;
      height: 3px;
      background: transparent;
      visibility: hidden;
    }

    .barra-carregando.ativa { visibility: visible; }
    .barra-carregando .indeterminate { background: var(--amarelo); }

    /* Campo do CEP em destaque */
    .bloco-cep {
      padding-bottom: 8px;
      margin-bottom: 20px;
      border-bottom: 2px dashed var(--linha);
    }

    #cep {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: .08em;
      height: 4rem;
      color: var(--tinta);
    }

    #cep::placeholder {
      color: #b9c4d6;
      opacity: 1;
    }

    .dica-enter {
      margin: 0 0 12px 3rem;
      font-size: .9rem;
      color: var(--texto-suave);
    }

    kbd {
      font-family: 'Figtree', sans-serif;
      font-weight: 600;
      font-size: .8rem;
      padding: 2px 7px;
      border: 1px solid var(--linha);
      border-bottom-width: 2px;
      border-radius: 5px;
      background: #f5f7fb;
      color: var(--tinta);
    }

    /* Campos do Materialize */
    .input-field label {
      color: var(--texto-suave);
      font-size: 1rem;
    }

    .input-field .prefix {
      color: var(--texto-suave);
      transition: color .2s;
    }

    .input-field .prefix.active {
      color: var(--azul);
    }

    .input-field input[type=text]:not(.browser-default) {
      border-bottom: 1px solid var(--linha);
      color: var(--texto);
      font-size: 1.05rem;
    }

    .input-field input[type=text]:not(.browser-default):focus:not([readonly]) {
      border-bottom: 2px solid var(--azul);
      box-shadow: 0 1px 0 0 var(--azul);
    }

    .input-field input[type=text]:not(.browser-default):focus:not([readonly]) + label {
      color: var(--azul);
    }

    /* Destaque rápido nos campos preenchidos pela busca */
    @keyframes preencher {
      from { background-color: rgba(255, 203, 5, .45); }
      to   { background-color: rgba(255, 203, 5, 0); }
    }

    .input-field.preenchido {
      animation: preencher 1.1s ease-out;
      border-radius: 6px 6px 0 0;
    }

    /* Mensagem de erro */
    .mensagem-erro {
      min-height: 24px;
      margin: 4px 0 16px;
      font-size: .95rem;
      font-weight: 500;
      color: var(--erro);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mensagem-erro .material-icons { font-size: 20px; }

    /* Botões */
    .acoes {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn-principal {
      background: var(--tinta);
      color: #fff;
      border-radius: 8px;
      height: 44px;
      line-height: 44px;
      padding: 0 22px;
      font-weight: 600;
      text-transform: none;
      letter-spacing: 0;
      box-shadow: none;
    }

    .btn-principal:hover,
    .btn-principal:focus {
      background: var(--azul);
      box-shadow: none;
    }

    .btn-secundario {
      background: transparent;
      color: var(--tinta);
      border: 1px solid var(--linha);
      border-radius: 8px;
      height: 44px;
      line-height: 42px;
      padding: 0 20px;
      font-weight: 600;
      text-transform: none;
      letter-spacing: 0;
      box-shadow: none;
    }

    .btn-secundario:hover,
    .btn-secundario:focus {
      background: #f1f4f9;
      box-shadow: none;
    }

    .btn:focus-visible,
    nav a:focus-visible,
    input:focus-visible {
      outline: 3px solid var(--amarelo);
      outline-offset: 2px;
    }

    footer {
      text-align: center;
      padding: 8px 16px 28px;
      font-size: .9rem;
      color: var(--texto-suave);
    }

    @media (max-width: 600px) {
      main { padding-top: 28px; }
      .etiqueta { padding: 34px 18px 22px; }
      #cep { font-size: 1.9rem; }
      .dica-enter { margin-left: 0; }
      .acoes .btn { flex: 1 1 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .input-field.preenchido { animation: none; }
    }
  </style>
</head>
<body>

        <nav>
        <div class="nav-wrapper">
            <a href="#" class="brand-logo">Materialize</a>
            <ul id="nav-mobile" class="right hide-on-med-and-down">
                <li><a href="grid.html">Grid</a></li>
                <li><a href="botoes.html">Botões</a></li>
                <li><a href="formulario.html">Formulários</a></li>
            </ul>
        </div>
    </nav>


  <!-- Conteúdo -->
  <main class="container">
    <div class="row" style="margin-bottom:0">
      <div class="col s12 m10 l8 offset-m1 offset-l2">

        <header class="intro">
          <h1>Descubra o endereço pelo CEP</h1>
          <p>Digite o CEP e o endereço completo aparece nos campos abaixo.</p>
        </header>

        <div class="etiqueta">
          <div class="progress barra-carregando" id="carregando">
            <div class="indeterminate"></div>
          </div>

          <form id="formEndereco" autocomplete="off" novalidate>
              <div class="row" style="margin-bottom:0">
                <div class="input-field col s12 m8" id="grupo-cep">
                  <i class="material-icons prefix">pin_drop</i>
                  <input id="cep" type="text" inputmode="numeric" maxlength="9" placeholder="00000-000" aria-describedby="dica-enter">
                  <label for="cep" class="active">CEP</label>
                </div>
              </div>
              <p class="dica-enter" id="dica-enter">Pressione <kbd>Enter</kbd> para buscar</p>
            </div>

            <div class="row" style="margin-bottom:0">
              <div class="input-field col s12" id="grupo-endereco">
                <i class="material-icons prefix">home</i>
                <input id="endereco" type="text">
                <label for="endereco">Endereço</label>
              </div>
            </div>

            <div class="row" style="margin-bottom:0">
              <div class="input-field col s12 m6" id="grupo-bairro">
                <i class="material-icons prefix">map</i>
                <input id="bairro" type="text">
                <label for="bairro">Bairro</label>
              </div>
              <div class="input-field col s12 m6" id="grupo-cidade">
                <i class="material-icons prefix">location_city</i>
                <input id="cidade" type="text">
                <label for="cidade">Cidade</label>
              </div>
            </div>

            <div class="row" style="margin-bottom:0">
              <div class="input-field col s12 m4" id="grupo-estado">
                <i class="material-icons prefix">flag</i>
                <input id="estado" type="text" maxlength="2">
                <label for="estado">Estado</label>
              </div>
            </div>

            <p class="mensagem-erro" id="erro" role="alert"></p>

            <div class="acoes">
              <button type="button" class="btn btn-principal waves-effect waves-light" id="btnBuscar">
                <i class="material-icons left">search</i>Buscar endereço
              </button>
              <button type="button" class="btn btn-secundario waves-effect" id="btnLimpar">
                Limpar campos
              </button>
            </div>
          </form>
        </div>

      </div>
    </div>
  </main>

  <footer>Dados fornecidos pela API gratuita ViaCEP.</footer>

  <!-- Materialize JS (via CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>

  <script>
    const campoCep = document.getElementById('cep');
    const campoEndereco = document.getElementById('endereco');
    const campoBairro = document.getElementById('bairro');
    const campoCidade = document.getElementById('cidade');
    const campoEstado = document.getElementById('estado');
    const barra = document.getElementById('carregando');
    const erro = document.getElementById('erro');

    // Impede o envio do formulário (o ENTER não recarrega a página)
    document.getElementById('formEndereco').addEventListener('submit', function (e) {
      e.preventDefault();
    });

    // Máscara: 00000-000
    campoCep.addEventListener('input', function () {
      let valor = campoCep.value.replace(/\D/g, '').slice(0, 8);
      if (valor.length > 5) {
        valor = valor.slice(0, 5) + '-' + valor.slice(5);
      }
      campoCep.value = valor;
    });

    // Busca ao pressionar ENTER no campo CEP
    campoCep.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        buscarCep();
      }
    });

    document.getElementById('btnBuscar').addEventListener('click', buscarCep);

    document.getElementById('btnLimpar').addEventListener('click', function () {
      campoCep.value = '';
      limparEndereco();
      mostrarErro('');
      campoCep.focus();
    });

    function mostrarErro(texto) {
      erro.innerHTML = '';
      if (!texto) return;
      const icone = document.createElement('i');
      icone.className = 'material-icons';
      icone.textContent = 'error_outline';
      erro.appendChild(icone);
      erro.appendChild(document.createTextNode(texto));
    }

    function limparEndereco() {
      campoEndereco.value = '';
      campoBairro.value = '';
      campoCidade.value = '';
      campoEstado.value = '';
      M.updateTextFields();
    }

    // Destaca brevemente os campos preenchidos pela busca
    function destacarCampos() {
      ['endereco', 'bairro', 'cidade', 'estado'].forEach(function (nome) {
        const grupo = document.getElementById('grupo-' + nome);
        grupo.classList.remove('preenchido');
        void grupo.offsetWidth; // reinicia a animação
        grupo.classList.add('preenchido');
      });
    }

    async function buscarCep() {
      const cep = campoCep.value.replace(/\D/g, '');
      mostrarErro('');

      if (cep.length !== 8) {
        limparEndereco();
        mostrarErro('CEP inválido. Digite os 8 números do CEP.');
        return;
      }

      barra.classList.add('ativa');

      try {
        // API gratuita ViaCEP
        const resposta = await fetch('https://viacep.com.br/ws/' + cep + '/json/');
        if (!resposta.ok) throw new Error('Falha na consulta');

        const dados = await resposta.json();

        if (dados.erro) {
          limparEndereco();
          mostrarErro('CEP não encontrado. Confira o número e tente de novo.');
          return;
        }

        campoEndereco.value = dados.logradouro || '';
        campoBairro.value = dados.bairro || '';
        campoCidade.value = dados.localidade || '';
        campoEstado.value = dados.uf || '';

        // Atualiza os rótulos flutuantes do Materialize
        M.updateTextFields();
        destacarCampos();
      } catch (e) {
        limparEndereco();
        mostrarErro('Não foi possível consultar o CEP agora. Verifique sua conexão e tente de novo.');
      } finally {
        barra.classList.remove('ativa');
      }
    }
  </script>
</body>
</html>
