<style>
    .col {
        border: 1px solid;
        height: 50px;

</style>


<body>
  <nav>
    <div class="nav-wrapper">
      <a href="#" class="brand-logo">Materialize</a>

  <div class="conteiner" class="center">
    <h1 class="center">Aprnedendo Materialize CSS - GRID</h1>

    
    <div class="row" class="center">
        <h4>Dividindo em 12 colunas</h4>
      <div class="col s1">1</div>
      <div class="col s1">2</div>
      <div class="col s1">3</div>
      <div class="col s1">4</div>
      <div class="col s1">5</div>
      <div class="col s1">6</div>
      <div class="col s1">7</div>
      <div class="col s1">8</div>
      <div class="col s1">9</div>
      <div class="col s1">10</div>
      <div class="col s1">11</div>
      <div class="col s1">12</div>
    </div>

    <div class="row">
        <h4>Dividindo em 3 colunas</h4>

      <div class="col s4">1</div>
      <div class="col s4">2</div>
      <div class="col s4">3</div>
    </div>

    <div class="row">
        <h4>Dividindo em 2 colunas</h4>

      <div class="col s4">MENU</div>
      <div class="col s8">CONTEUDO</div>
    </div>
          
     <div class="row">
        <h4>Cnetralizando em 4 colunas</h4>

      <div class="col s4 offset-s4">CONTUDO CENTRALIZADO</div>
    </div>
          

  </div>
